  window.addEventListener('unhandledrejection', e => { try { localStorage.setItem('smp_last_error', JSON.stringify({message:String(e.reason?.message||e.reason), time:new Date().toISOString()})); } catch {} });
  window.addEventListener('online', () => document.documentElement.dataset.network='online');

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__smpInstallPrompt=e; });
  window.SmartMealAI = {
    async generate(payload) {
      const r = await fetch(window.SMARTMEAL_API_URL, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || 'AI unavailable');
      return r.json();
    }
  };
  window.SmartMealDiagnostics = {
    run() {
      const results=[];
      const tests=[['localStorage',()=>{localStorage.setItem('__smp_test','1'); return localStorage.getItem('__smp_test')==='1';}],['serviceWorker',()=>('serviceWorker' in navigator)],['speech',()=>('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)],['share',()=>('share' in navigator)],['online',()=>navigator.onLine]];

      return results;
    }
  };

<script id="SMARTMEAL_V11_VOICE">
(()=>{
  let currentRec=null;
  window.SmartMealVoice={
    supported:()=>!!(window.SpeechRecognition||window.webkitSpeechRecognition),
    speak(text,lang='ar-DZ'){
      if(!('speechSynthesis' in window)) return false;
      speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text));
      u.lang=lang; u.rate=.95; u.pitch=1; u.volume=1;
      speechSynthesis.speak(u); return true;
    },
    listen(onText,onDone,onError,lang='ar-DZ'){
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){onError?.('unsupported');return false}
      try{
        if(currentRec) currentRec.abort();
        const r=new SR(); currentRec=r; r.lang=lang; r.continuous=false; r.interimResults=false; r.maxAlternatives=1;
        r.onresult=e=>{const text=e?.results?.[0]?.[0]?.transcript?.trim();if(text)onText?.(text)};
        r.onerror=e=>onError?.(e.error||'error');
        r.onend=()=>{currentRec=null;onDone?.()}; r.start(); return true;
      }catch(e){currentRec=null;onError?.('start-failed');return false}
    }
  };
})();
</script>

/* ---------- أدوات ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const escapeHtml = (s) => String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = n => {

  if (!Number.isFinite(v)) return '0';

};
const fmt1 = n => {
  const v = Number(n);

};

const todayKey = () => new Date().toISOString().slice(0,10);

if ('serviceWorker' in navigator) {

  });

/* ---------- IndexedDB Layer (قاعدة بيانات محلية متقدمة) ---------- */
const DB_NAME = 'smp_db_v4';
const DB_VERSION = 1;
const DB_STORES = ['meals','weight','favorites','scan_history','achievements','settings'];

const IDB = {
  db: null,
  open(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        DB_STORES.forEach(s => {
          if (!db.objectStoreNames.contains(s)) {
            const store = db.createObjectStore(s, { keyPath: 'id', autoIncrement: true });
            if (s === 'meals' || s === 'weight' || s === 'scan_history') store.createIndex('date', 'date');
          }
        });
      };
      req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
      req.onerror = (e) => reject(e);
    });
  },
  async add(store, data){
    if (!this.db) await this.open();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).add(data);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async getAll(store){
    if (!this.db) await this.open();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async put(store, data){
    if (!this.db) await this.open();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).put(data);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async delete(store, id){
    if (!this.db) await this.open();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }
};

const Subscription = {
  current: 'free',
  startDate: null,
  expiryDate: null,
  
  init(){
    this.current = Store.get('smp_sub_v5', 'free');
    this.startDate = Store.get('smp_sub_start_v5', null);
    this.expiryDate = Store.get('smp_sub_expiry_v5', null);
  },
  
  getCurrent(){
    return PLANS[this.current] || PLANS.free;
  },
  
  canAccess(feature, value){
    const plan = this.getCurrent();
    if (feature === 'scan') return (this.scansUsed || 0) < plan.limit.scans;
    if (feature === 'recipe') return value < plan.limit.recipes;
    if (feature === 'language') return value < plan.limit.languages;
    return true;
  },
  
  upgrade(planId){
    if (!PLANS[planId]) return false;
    this.current = planId;
    this.startDate = new Date().toISOString();
    this.expiryDate = planId === 'free' ? null : new Date(Date.now() + 30*24*60*60*1000).toISOString();
    Store.set('smp_sub_v5', this.current);
    Store.set('smp_sub_start_v5', this.startDate);
    Store.set('smp_sub_expiry_v5', this.expiryDate);
    return true;
  },
  
  incrementScan(){
    const used = Store.get('smp_scans_used_v7', 0) + 1;
    Store.set('smp_scans_used_v7', used);
    this.scansUsed = used;
    return used;
  },
  
  resetScans(){
    Store.set('smp_scans_used_v7', 0);
    this.scansUsed = 0;
  }
};

function t(path, ...args){
  const lang = state.lang || 'ar';
  const keys = path.split('.');
  let val = I18N[lang];
  for (const k of keys){ if (val && val[k] !== undefined) val = val[k]; else { val = I18N.ar; for (const k2 of keys){ if (val && val[k2] !== undefined) val = val[k2]; else return path; } break; } }
  if (typeof val === 'function') return val(...args);
  return val;
}

function pickTip(key){
  const lang = state.lang || 'ar';
  const arr = I18N[lang]?.tips?.[key] || I18N.ar.tips[key] || [''];
  return arr[Math.floor(Math.random()*arr.length)];
}

/* ---------- حساب الماكروز Mifflin-St Jeor ---------- */
const ACTIVITY = { sedentary:{label:'Sedentary',factor:1.2}, light:{label:'Light',factor:1.375}, moderate:{label:'Moderate',factor:1.55}, active:{label:'High',factor:1.725}, very_active:{label:'Very High',factor:1.9} };
const GOAL = { cut:{label:'Fat loss',mult:0.80,color:'#ef4444',emoji:'🔥'}, maintain:{label:'Maintain',mult:1.00,color:'#10b981',emoji:'⚖️'}, bulk:{label:'Bulk',mult:1.15,color:'#3b82f6',emoji:'💪'}, recomp:{label:'Recomp',mult:0.90,color:'#f59e0b',emoji:'⚡'} };

// labels حسب اللغة
function activityLabel(k){ return t('activity.'+k); }
function goalLabel(k){ return t('goals.'+k); }
function goalEmoji(k){ return t('goalEmoji.'+k); }
function difficultyLabel(k){ const m={easy:'diff.easy',medium:'diff.medium',hard:'diff.hard'}; return t(m[k]||k); }

function calcBMR({gender, age, height, weight}){
  const base = 10*weight + 6.25*height - 5*age;
  return gender === 'male' ? base + 5 : base - 161;
}
function computeMacros(p){
  const bmr = calcBMR(p);
  const tdee = bmr * (ACTIVITY[p.activity]?.factor || 1.2);
  const calories = Math.round(tdee * (GOAL[p.goal]?.mult || 1));
  let protRatio=0.30, carbRatio=0.40, fatRatio=0.30;
  if (p.goal==='bulk')   { protRatio=0.25; carbRatio=0.50; fatRatio=0.25; }
  if (p.goal==='cut')    { protRatio=0.35; carbRatio=0.35; fatRatio=0.30; }
  if (p.goal==='recomp') { protRatio=0.30; carbRatio=0.40; fatRatio=0.30; }
  return { calories, protein: Math.round((calories*protRatio)/4), carbs: Math.round((calories*carbRatio)/4), fat: Math.round((calories*fatRatio)/9) };
}
function bmiCalc(height, weight){ return +(weight/((height/100)**2)).toFixed(1); }
function bmiInfo(b){ if(b<18.5) return {label: b<18.5?'Underweight':'', color:'#3b82f6'}; if(b<25) return {label:'Normal',color:'#10b981'}; if(b<30) return {label:'Overweight',color:'#f59e0b'}; return {label:'Obese',color:'#ef4444'}; }
function bmiInfoAr(b){ if(b<18.5) return {label:'نحيف', color:'#3b82f6'}; if(b<25) return {label:'مثالي', color:'#10b981'}; if(b<30) return {label:'زيادة', color:'#f59e0b'}; return {label:'سمنة', color:'#ef4444'}; }
function bmiLabel(b){ return state.lang==='ar' ? bmiInfoAr(b).label : (b<18.5?'Underweight':b<25?'Normal':b<30?'Overweight':'Obese'); }
function bmiColor(b){ return b<18.5?'#3b82f6':b<25?'#10b981':b<30?'#f59e0b':'#ef4444'; }

}

/* ---------- AI مولّد الوصفات الذكي (محسّن) ---------- */
function generateRecipes(ingredientsText, remainingCalories, goal){
  const userSet = parseIngredients(ingredientsText);
  const cal = Math.max(200, Number(remainingCalories) || 2000);
  const lang = state.lang || 'ar';

  // منطق AI: مطابقة ذكية مع مراعاة الهدف
  const scored = RECIPES.map(r => {
    // المكونات بعد التطبيع للغلة الحالية
    const recipeIngs = (r.ingredients[lang] || r.ingredients.ar).map(normalizeIngredient);
    let match = 0;
    recipeIngs.forEach(i => { if (userSet.includes(i)) match++; });
    const coverage = recipeIngs.length ? match / recipeIngs.length : 0;

    // تطابق جزئي: لو في مكون شائع زي "دجاج" و المستخدم كتب "فراخ" هيتم
    // عقوبة لو المكون الأساسي (بروتين) ناقص
    const proteinMissing = r.category === 'chicken' || r.category === 'beef' || r.category === 'fish' ? (userSet.includes('chicken') || userSet.includes('beef') || userSet.includes('fish') || userSet.includes('egg') || userSet.includes('tuna') || userSet.includes('salmon')) : true;

    // عقوبة لو السعرات تتجاوز المتبقي بأكثر من 40%
    const overCal = Math.max(0, r.macros.cal - cal);
    const calPenalty = overCal > 0 ? Math.min(1, overCal / (cal * 0.5)) : 0;
    const calOk = 1 - calPenalty;

    // مكافأة البروتين للهدف bulk
    const proteinBonus = (goal === 'bulk' && r.macros.p >= 30) ? 0.1 : 0;
    // عقوبة الدهون للهدف cut
    const fatPenalty = (goal === 'cut' && r.macros.f > 25) ? 0.15 : 0;

    // مكافأة الفئة النباتية للمبتدئين
    const vegBonus = (r.category === 'vegetarian' || r.category === 'breakfast') && userSet.length < 3 ? 0.05 : 0;

    const score = (coverage * 0.55) + (calOk * 0.25) + proteinBonus + vegBonus - fatPenalty;
    return { ...r, score: Math.max(0, score), match, missing: recipeIngs.length - match, proteinOk: proteinMissing };
  });

  // ترتيب + تنويع (ما نختارش 3 من نفس الفئة)
  scored.sort((a,b) => b.score - a.score);
  const result = [];
  const usedCats = new Set();
  for (const r of scored){
    if (result.length >= 3) break;
    if (r.score < 0.05) continue;
    if (usedCats.has(r.category) && result.length < 3){
      // محاولة نختار واحد من فئة مختلفة
      const alt = scored.find(x => !usedCats.has(x.category) && x.score > 0.1 && !result.find(y => y.id === x.id));
      if (alt && result.length < 3) { result.push(alt); usedCats.add(alt.category); continue; }
    }
    result.push(r);
    usedCats.add(r.category);
  }

  // لو أقل من 3، نملأ
  if (result.length < 3){
    for (const r of RECIPES){
      if (result.length >= 3) break;
      if (!result.find(x => x.id === r.id)) result.push(r);
    }
  }
  return result;
}

const ACHIEVEMENTS = [
  { id:'first_meal', emoji:'🎯', check: (l) => l.length >= 1 },
  { id:'three_meals', emoji:'🥗', check: (l) => l.length >= 3 },
  { id:'on_target', emoji:'🎯', check: (l,p) => l.length && (l.reduce((a,i)=>a+(i.macros?.cal||0),0)/p.macros.calories) >= 0.9 && (l.reduce((a,i)=>a+(i.macros?.cal||0),0)/p.macros.calories) <= 1.0 },
  { id:'week_streak', emoji:'🔥', check: () => { for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); const k=d.toISOString().slice(0,10); const log=Store.get(KEYS.LOG(k)); if(!log || !log.items || !log.items.length) return false; } return true; } },
  { id:'first_scan', emoji:'📸', check: () => (Store.get(KEYS.SCANHIST,[])).length >= 1 },
  { id:'protein_goal', emoji:'💪', check: (l,p) => l.reduce((a,i)=>a+(i.macros?.p||0),0) >= p.macros.protein },
];
function checkAchievements(log, profile){
  const unlocked = Store.get(KEYS.ACHV, []);
  const newly = [];
  ACHIEVEMENTS.forEach(a => {
    if (unlocked.includes(a.id)) return;
    if (a.check(log, profile)) newly.push(a);
  });
  if (newly.length){
    Store.set(KEYS.ACHV, [...unlocked, ...newly.map(a => a.id)]);
    return newly;
  }
  return [];
}

    if (!file) return;

      const dataUrl = await compressImage(file, 1600, 0.82);
      selectedImage = { dataUrl, mimeType: 'image/jpeg', name: file.name };

    }catch(err){ toast(t('toasts.readError')); }
  }

  async function compressImage(file, maxSize=1600, quality=0.82){
    const src = await new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file);
    });
    const img = await new Promise((resolve,reject)=>{
      const im = new Image(); im.onload=()=>resolve(im); im.onerror=reject; im.src=src;
    });
    const scale = Math.min(1, maxSize / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg', quality);
  }

  cam.onchange = (e) => handleFile(e.target.files && e.target.files[0]);

function renderWeight(){
  const p = state.profile;
  const history = Store.get(KEYS.WEIGHT, []);
  const sorted = history.slice().sort((a,b) => new Date(a.date) - new Date(b.date));
  const current = sorted.length ? sorted[sorted.length-1].weight : p.weight;
  const startWeight = p.weight;
  const diff = current - startWeight;
  const goalWeight = startWeight * ({cut:0.95, bulk:1.05, recomp:0.97, maintain:1}[p.goal] || 1);
  const points = sorted.length > 1 ? sorted : [{date:new Date().toISOString().slice(0,10),weight:p.weight}];
  const minW = Math.min(...points.map(x=>x.weight), goalWeight) - 2;
  const maxW = Math.max(...points.map(x=>x.weight), startWeight) + 2;
  const range = maxW - minW || 1;
  const chartW = 320, chartH = 160;
  const path = points.map((pt,i) => {
    const x = (i / Math.max(1, points.length-1)) * (chartW - 40) + 20;
    const y = chartH - 20 - ((pt.weight - minW) / range) * (chartH - 40);
    return `${i===0?'M':'L'} ${x} ${y}`;
  }).join(' ');

/* ---------- Router الرئيسي ---------- */
function render(){
  loadState();
  applyLang();
  const onboarded = !!state.profile;
  const nav = $('#bottomNav');
  if (onboarded){ nav.classList.remove('hidden'); } else { nav.classList.add('hidden'); }
  $$('.nav-btn').forEach(b => {
    const active = onboarded && b.dataset.tab === state.tab;
    b.classList.toggle('tab-active', active);
    b.classList.toggle('tab-idle', !active);
  });
  if (!onboarded) return renderOnboarding();
  if (state.tab === 'home') return renderHome();
  if (state.tab === 'scan') return renderScanner();
  if (state.tab === 'recipes') return renderRecipes();
  if (state.tab === 'weight') return renderWeight();
  if (state.tab === 'settings') return renderSettings();
}

/* ---------- Event Delegation (النقرات) ---------- */
document.addEventListener('click', async (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;

  if (action === 'nav' || action === 'go-tab'){ state.tab = target.dataset.tab; return render(); }
  if (action === 'set-lang'){
    const l = target.dataset.lang;
    if (LANGS.includes(l)){
      state.lang = l;
      Store.set(KEYS.LANG, l);
      render();
      toast('🌐 ' + I18N[l].name);
    }
    return;
  }
  if (action === 'open-profile'){ state.tab = 'settings'; return render(); }
  if (action === 'add-meal'){
    const id = target.dataset.id;
    const r = (state.recipes || []).find(x => x.id === id) || RECIPES.find(x => x.id === id);
    if (!r){ toast(t('toasts.genericError')); return; }
    addMealToLog(r);
    return;
  }
  if (action === 'del-meal'){
    const idx = Number(target.dataset.idx);
    if (Number.isInteger(idx) && state.log.items[idx]){
      state.log.items.splice(idx, 1);
      Store.set(KEYS.LOG(state.log.date), state.log);
      toast(t('toasts.removed'));
      render();
    }
    return;
  }
  if (action === 'refresh-recipes'){
    const consumed = state.log.items.reduce((a,it) => a + (it.macros?.cal||0), 0);
    const remain = Math.max(200, (state.profile.macros.calories||2000) - consumed);
    const list = generateRecipes(state.ingredientsText, remain, state.profile.goal);
    state.recipes = list;
    Store.set(KEYS.RECIPES, list);
    render();
    toast(t('toasts.scanUpdated'));
    return;
  }
  if (action === 'filter-cat'){ state.activeFilters.category = target.dataset.cat || null; return renderRecipes(); }
  if (action === 'toggle-fav'){
    const id = target.dataset.id;
    const favs = Store.get(KEYS.FAV, []);
    const idx = favs.indexOf(id);
    if (idx >= 0){ favs.splice(idx,1); toast(t('toasts.favRemoved')); }
    else { favs.push(id); toast(t('toasts.favAdded')); }
    Store.set(KEYS.FAV, favs);
    render();
    return;
  }
  if (action === 'share-recipe'){
    const id = target.dataset.id;
    const r = RECIPES.find(x => x.id === id);
    if (!r) return;
    const name = localText(r.name);
    const ings = (r.ingredients[state.lang]||r.ingredients.ar).map(i=>'• '+i).join('\n');
    const steps = (r.steps[state.lang]||r.steps.ar).map((s,i)=>`${i+1}. ${s}`).join('\n');
    const text = `🍽️ ${name}\n\n📊 ${r.macros.cal} cal • ${r.macros.p}P • ${r.macros.c}C • ${r.macros.f}F\n\n${t('recipe.ingredients')}:\n${ings}\n\n${t('recipe.steps')}:\n${steps}\n\n${t('app.title')} 🥗`;
    if (navigator.share){ navigator.share({ title: name, text }).catch(() => copyText(text)); }
    else copyText(text);
    return;
  }
  if (action === 'trigger-camera'){ e.preventDefault(); $('#cameraInput').click(); return; }
  if (action === 'trigger-gallery'){ e.preventDefault(); $('#galleryInput').click(); return; }
  if (action === 'remove-image'){ selectedImage=null; $('#previewImg').src = ''; $('#previewBox').classList.add('hidden'); return; }
  if (action === 'voice-input'){
    const b=document.querySelector('[data-action="voice-input"]');
    const lang=state.lang==='ar'?'ar-DZ':state.lang==='fr'?'fr-FR':'en-US';
    if(b){b.disabled=true;b.classList.add('opacity-60');}
    toast(t('scan.speak'));
    if(window.AndroidVoice && typeof window.AndroidVoice.startListening === 'function'){
      window.__voiceButton=b;
      window.AndroidVoice.startListening(lang);
      return;
    }
    if(!window.SmartMealVoice?.supported()){
      if(b){b.disabled=false;b.classList.remove('opacity-60');}
      toast('الإدخال الصوتي غير متاح هنا');
      return;
    }
    window.SmartMealVoice.listen(text=>{
      const ing=$('#ingInput'); ing.value=ing.value?ing.value+', '+text:text; saveIngredients(ing.value);
    },()=>{if(b){b.disabled=false;b.classList.remove('opacity-60');} toast(t('toasts.voiceDone'));},err=>{
      if(b){b.disabled=false;b.classList.remove('opacity-60');}
      toast(err==='not-allowed'?'اسمح باستخدام الميكروفون':err==='unsupported'?'الإدخال الصوتي غير مدعوم':'تعذّر التعرف على الصوت');
    },lang);
    return;
  }
  if (action === 'quick-add-ing'){
    const ing = $('#ingInput');
    const cur = ing.value.trim();
    const newIng = target.dataset.ing;
    ing.value = cur ? cur + ', ' + newIng : newIng;
    saveIngredients(ing.value);
    return;
  }
  if (action === 'generate'){
    const text = $('#ingInput').value.trim();
    if (!text && !selectedImage){ toast(t('toasts.noIngredients')); return; }
    const sub = Subscription.getCurrent();
    const scansUsed = Store.get('smp_scans_used_v7', 0);
    if (scansUsed >= sub.limit.scans){
      openPricingModal();
      toast(state.lang==='ar'?'⚠️ وصلت لحد المسحات في الباقة المجانية':state.lang==='fr'?'⚠️ Limite de scans atteinte':'⚠️ Scan limit reached');
      return;
    }
    Subscription.incrementScan();
    saveIngredients(text);
    const hist = Store.get(KEYS.SCANHIST, []);
    hist.push({ time: new Date().toLocaleString('en-US'), ing: text || (selectedImage?.name || 'image') });
    Store.set(KEYS.SCANHIST, hist.slice(-20));
    if (!Store.get(KEYS.ACHV, []).includes('first_scan')){ const a = Store.get(KEYS.ACHV, []); a.push('first_scan'); Store.set(KEYS.ACHV, a); }
    const loader = $('#scannerLoader');
    const stepEl = $('#loaderStep');
    loader.classList.remove('hidden');
    const steps = t('scan.steps');
    let i = 0; stepEl.textContent = steps[0];
    const stepTimer = setInterval(() => { i++; if (i < steps.length) stepEl.textContent = steps[i]; }, 700);
    try{
      const payload = {
        language: state.lang,
        goal: state.profile?.goal || 'maintain',
        targetCalories: state.profile?.macros?.calories || 2000,
        text: text || '',
        image: selectedImage?.dataUrl || null
      };
      const result = await SmartMealAI.generate(payload);
      lastAIResult = result;
      clearInterval(stepTimer); loader.classList.add('hidden');
      renderAIResult(result);
    }catch(err){
      clearInterval(stepTimer); loader.classList.add('hidden');
      toast(state.lang==='ar' ? 'تعذر الاتصال بالذكاء الاصطناعي. تحقق من إعداد AI.' : state.lang==='fr' ? 'IA indisponible. Vérifiez la configuration.' : 'AI unavailable. Check the AI configuration.');
      console.error(err);
    }
    return;
  }
  if (action === 'close-ai-result'){ document.getElementById('aiResultCard')?.remove(); return; }
  if (action === 'add-ai-meal'){
    if (!lastAIResult?.isFood) return;
    const n=lastAIResult.nutrition||{};
    const meal={uid:'ai_'+Date.now(),name:lastAIResult.mealName||'AI meal',emoji:'🍽️',macros:{cal:Number(n.calories)||0,p:Number(n.protein)||0,c:Number(n.carbs)||0,f:Number(n.fat)||0},time:new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})};
    state.log.items.push(meal); Store.set(KEYS.LOG(todayKey()),state.log);
    document.getElementById('aiResultCard')?.remove(); state.tab='home'; render(); toast(t('toasts.mealAdded')); return;
  }
  if (action === 'open-add-meal'){ openAddMealModal(); return; }
  if (action === 'open-favs'){ openFavsModal(); return; }
  if (action === 'set-theme'){
    const th = target.dataset.theme;
    Store.set(KEYS.THEME, th);
    document.documentElement.classList.toggle('dark', th === 'dark');
    render();
    return;
  }
  if (action === 'reset-today'){
    if (!confirm(state.lang==='ar'?'سيتم حذف سجل اليوم فقط، هل تريد المتابعة؟':state.lang==='fr'?'Supprimer uniquement le journal du jour ?':'Delete only today\'s log?')) return;
    state.log = { date: todayKey(), items: [] };
    Store.set(KEYS.LOG(todayKey()), state.log);
    toast(t('toasts.resetToday'));
    render();
    return;
  }
  if (action === 'reset-all'){
    if (!confirm(state.lang==='ar'?'سيتم حذف كل البيانات بشكل كامل، هل أنت متأكد؟':state.lang==='fr'?'Effacer toutes les données ?':'Erase all data?')) return;
    Store.wipe();
    state.profile = null;
    state.recipes = [];
    state.ingredientsText = '';
    state.log = { date: todayKey(), items: [] };
    state.tab = 'home';
    render();
    toast(t('toasts.resetAll'));
    return;
  }
  if (action === 'export-all'){
    const data = { profile: state.profile, log: state.log, weight: Store.get(KEYS.WEIGHT, []), favorites: Store.get(KEYS.FAV, []), achievements: Store.get(KEYS.ACHV, []), lang: state.lang, exportedAt: new Date().toISOString(), version: '4.0' };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `smp_backup_${todayKey()}.json`; a.click();
    URL.revokeObjectURL(url);
    toast(t('toasts.exportOk'));
    return;
  }
  if (action === 'export-weight'){
    const data = Store.get(KEYS.WEIGHT, []);
    if (!data.length){ toast(t('toasts.noData')); return; }
    const csv = 'date,weight_kg\n' + data.map(d => `${d.date},${d.weight}`).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `weight_${todayKey()}.csv`; a.click();
    URL.revokeObjectURL(url);
    toast(t('toasts.exportCsv'));
    return;
  }
  if (action === 'del-weight'){
    const date = target.dataset.date;
    let h = Store.get(KEYS.WEIGHT, []);
    h = h.filter(x => x.date !== date);
    Store.set(KEYS.WEIGHT, h);
    render();
    return;
  }
  if (action === 'reuse-scan'){
    const text = target.dataset.ing;
    state.ingredientsText = text;
    Store.set(KEYS.ING, text);
    state.tab = 'scan';
    render();
    return;
  }
  if (action === 'close-modal'){ return closeModal(); }
  if (action === 'open-pricing'){ return openPricingModal(); }
  if (action === 'open-landing'){ return openLandingModal(); }
  if (action === 'upgrade-plan'){
    const planId = target.dataset.plan;
    if (Subscription.upgrade(planId)){
      toast(state.lang==='ar'?'✅ تم ترقية الباقة':state.lang==='fr'?'✅ Plan mis à niveau':'✅ Plan upgraded');
      closeModal();
      // تحديث الإحصائيات في الواجهة
      if (planId === 'pro' || planId === 'family'){
        // إعادة حساب الوصول للمحتوى
        setTimeout(() => render(), 200);
      }
    }
    return;
  }
  if (action === 'add-custom-meal'){
    const name = $('#cm_name').value.trim();
    const cal = Number($('#cm_cal').value) || 0;
    const p = Number($('#cm_p').value) || 0;
    const c = Number($('#cm_c').value) || 0;
    const f = Number($('#cm_f').value) || 0;
    const emoji = $('#cm_emoji').value || '🍴';
    if (!name){ toast(t('toasts.enterName')); return; }
    if (cal <= 0){ toast(t('toasts.enterCal')); return; }
    addMealToLog({ name, emoji, macros: { cal, p, c, f } });
    closeModal();
    return;
  }
});

/* ---------- إضافة للسجل ---------- */
function addMealToLog(r){
  const name = typeof r.name === 'object' ? localText(r.name) : r.name;
  const item = { uid:'m_'+Date.now(), name, emoji:r.emoji, macros:r.macros, time: new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) };
  state.log.items.push(item);
  Store.set(KEYS.LOG(state.log.date), state.log);
  const newAch = checkAchievements(state.log.items, state.profile);
  toast(t('toasts.mealAdded'));
  state.tab = 'home';
  render();
  if (newAch.length){ setTimeout(() => toast('🏆 ' + t('achievements.'+newAch[0].id)), 1500); }
}
function copyText(text){
  try{ navigator.clipboard.writeText(text); toast(t('toasts.copied')); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    toast(t('toasts.copied'));
  }
}

/* ---------- submit handler موحد ---------- */
document.addEventListener('submit', (e) => {
  const form = e.target;
  if (form.id === 'onboardForm'){
    e.preventDefault();
    const fd = new FormData(form);
    const profile = {
      name: 'مستخدم', age: Number(fd.get('age')), gender: fd.get('gender'),
      height: Number(fd.get('height')), weight: Number(fd.get('weight')),
      activity: fd.get('activity'), goal: fd.get('goal'),
    };
    if (!profile.age || !profile.height || !profile.weight){ toast(t('toasts.completeData')); return; }
    const macros = computeMacros(profile);
    state.profile = { ...profile, macros };
    Store.set(KEYS.PROFILE, state.profile);
    Store.set(KEYS.ONBOARD, true);
    toast(t('toasts.profileSaved'));
    state.tab = 'home';
    render();
    return;
  }
  if (form.id === 'profileForm'){
    e.preventDefault();
    const fd = new FormData(form);
    const profile = {
      name: fd.get('name') || 'User', age: Number(fd.get('age')), gender: state.profile.gender,
      height: Number(fd.get('height')), weight: Number(fd.get('weight')),
      activity: fd.get('activity'), goal: fd.get('goal'),
    };
    const macros = computeMacros(profile);
    state.profile = { ...profile, macros };
    Store.set(KEYS.PROFILE, state.profile);
    toast(t('toasts.updated'));
    state.tab = 'home';
    render();
    return;
  }
  if (form.id === 'weightForm'){
    e.preventDefault();
    const fd = new FormData(form);
    const date = fd.get('date');
    const weight = Number(fd.get('weight'));
    if (!date || !weight || weight < 20 || weight > 300){ toast(t('toasts.badData')); return; }
    let h = Store.get(KEYS.WEIGHT, []);
    const existing = h.findIndex(x => x.date === date);
    if (existing >= 0) h[existing].weight = weight;
    else h.push({ date, weight });
    h.sort((a,b) => a.date.localeCompare(b.date));
    Store.set(KEYS.WEIGHT, h);
    toast(t('toasts.weightAdded'));
    render();
    return;
  }
});

function boot(){
  try{
    Subscription.init();
    IDB.open().catch(e => console.log('IDB open failed', e));
    render();
  }
  catch(err){
    console.error('Boot error', err);
    document.getElementById('app').innerHTML = `<div class="p-8 text-center"><div class="text-5xl mb-3">😵</div><h2 class="font-bold text-lg">Error</h2><p class="text-sm text-gray-500 mt-2">${escapeHtml(err.message||'')}</p><button data-action="reset-all" class="mt-4 px-4 py-2 bg-red-500 text-white rounded-xl text-sm font-bold">Reset</button></div>`;
  }
}
if (document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
